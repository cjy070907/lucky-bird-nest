<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="50%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <linearGradient id="hiltGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe080"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <!-- Curved blade -->
  <path d="M50 170 Q60 130 80 100 Q95 78 110 65 Q120 57 125 52" fill="none" stroke="url(#bladeGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Blade edge highlight -->
  <path d="M52 168 Q62 130 82 100 Q96 79 110 66" fill="none" stroke="#f0f0f0" stroke-width="2" opacity="0.6"/>
  <!-- Blade tip -->
  <path d="M125 52 L130 45 L122 50 Z" fill="#d0d0d0"/>
  <!-- Cross guard -->
  <path d="M105 68 Q115 60 125 55" fill="none" stroke="url(#hiltGold)" stroke-width="5" stroke-linecap="round"/>
  <path d="M108 72 Q118 64 128 59" fill="none" stroke="#8B6914" stroke-width="1.5"/>
  <!-- Handle -->
  <path d="M125 52 Q135 42 145 35 Q152 30 155 28" fill="none" stroke="url(#hiltGold)" stroke-width="7" stroke-linecap="round"/>
  <!-- Handle wrapping details -->
  <line x1="130" y1="48" x2="135" y2="42" stroke="#8B6914" stroke-width="1.5"/>
  <line x1="137" y1="42" x2="142" y2="37" stroke="#8B6914" stroke-width="1.5"/>
  <line x1="144" y1="36" x2="149" y2="31" stroke="#8B6914" stroke-width="1.5"/>
  <!-- Pommel -->
  <circle cx="156" cy="27" r="7" fill="url(#hiltGold)" stroke="#8B6914" stroke-width="1.5"/>
  <circle cx="156" cy="27" r="3" fill="#ffe080"/>
  <!-- Guard ornament -->
  <circle cx="115" cy="63" r="4" fill="#ffe080" stroke="#8B6914" stroke-width="1"/>
</svg>
