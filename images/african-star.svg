<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f8ff;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#e8e8f0;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#d0d0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8b8d0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#c0c0d8;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="facet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#a0a0c0;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <!-- 钻石主体 -->
  <polygon points="100,20 160,80 100,180 40,80" fill="url(#diamond)" stroke="#a0a0b8" stroke-width="1"/>
  <!-- 刻面 -->
  <polygon points="100,20 130,60 100,80 70,60" fill="url(#facet1)" opacity="0.8"/>
  <polygon points="130,60 160,80 100,80" fill="url(#facet2)" opacity="0.7"/>
  <polygon points="70,60 100,80 40,80" fill="url(#facet2)" opacity="0.6"/>
  <polygon points="100,80 160,80 100,180" fill="url(#facet1)" opacity="0.5"/>
  <polygon points="100,80 40,80 100,180" fill="url(#facet2)" opacity="0.4"/>
  <!-- 高光 -->
  <polygon points="100,20 115,50 100,65 85,50" fill="#ffffff" opacity="0.9"/>
  <circle cx="90" cy="55" r="4" fill="#ffffff" opacity="0.8"/>
</svg>
