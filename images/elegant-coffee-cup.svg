<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0ece0"/>
    </linearGradient>
  </defs>
  <!-- Saucer -->
  <ellipse cx="100" cy="155" rx="65" ry="16" fill="#e8e0d0" stroke="#c8b890" stroke-width="1.5"/>
  <ellipse cx="100" cy="153" rx="55" ry="12" fill="#f5f0e8" stroke="#d4c8a8" stroke-width="1"/>
  <!-- Saucer gold rim pattern -->
  <ellipse cx="100" cy="154" rx="60" ry="14" fill="none" stroke="#c8a840" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Cup body -->
  <path d="M65 95 Q60 130 70 145 Q80 152 100 152 Q120 152 130 145 Q140 130 135 95 Z" fill="url(#porcelain)" stroke="#c8b890" stroke-width="1.5"/>
  <!-- Cup rim -->
  <ellipse cx="100" cy="95" rx="36" ry="10" fill="#f8f4ec" stroke="#c8b890" stroke-width="1.5"/>
  <ellipse cx="100" cy="95" rx="30" ry="7" fill="#e8e0d0"/>
  <!-- Gold decorative band on cup -->
  <path d="M67 120 Q100 130 133 120" fill="none" stroke="#c8a840" stroke-width="2.5"/>
  <path d="M66 126 Q100 136 134 126" fill="none" stroke="#c8a840" stroke-width="1.5"/>
  <!-- Diamond pattern on band -->
  <polygon points="85,120 90,116 95,120 90,124" fill="#c8a840" opacity="0.7"/>
  <polygon points="100,122 105,118 110,122 105,126" fill="#c8a840" opacity="0.7"/>
  <polygon points="115,120 120,116 125,120 120,124" fill="#c8a840" opacity="0.7"/>
  <!-- Handle -->
  <path d="M133 105 C150 105 155 120 150 135 C147 142 140 142 135 138" fill="none" stroke="#e8e0d0" stroke-width="5" stroke-linecap="round"/>
  <path d="M133 105 C150 105 155 120 150 135 C147 142 140 142 135 138" fill="none" stroke="#c8b890" stroke-width="1.5"/>
  <!-- Blue floral accents -->
  <circle cx="78" cy="110" r="3" fill="#6688bb" opacity="0.6"/>
  <circle cx="122" cy="110" r="3" fill="#6688bb" opacity="0.6"/>
  <circle cx="100" cy="108" r="2.5" fill="#6688bb" opacity="0.5"/>
</svg>
