<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e0f8;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#c0b0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8060b0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a3a2a" />
      <stop offset="50%" style="stop-color:#6a5a4a" />
      <stop offset="100%" style="stop-color:#3a2a1a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d0c0ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#8060c0;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <!-- 神秘光环 -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#a080d0" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="100" r="75" fill="none" stroke="#c0a0f0" stroke-width="0.5" opacity="0.2"/>
  <!-- 刀刃 - 蝴蝶刀造型 -->
  <path d="M100,25 L115,90 L100,100 L85,90 Z" fill="url(#blade)" stroke="#9080b0" stroke-width="0.8"/>
  <!-- 刀刃高光 -->
  <path d="M100,25 L107,75 L100,80 L93,75 Z" fill="#ffffff" opacity="0.4"/>
  <!-- 刀柄 -->
  <rect x="93" y="100" width="14" height="50" rx="3" fill="url(#handle)" stroke="#2a1a0a" stroke-width="0.8"/>
  <!-- 刀柄装饰 -->
  <line x1="95" y1="108" x2="105" y2="108" stroke="#8a7a6a" stroke-width="1"/>
  <line x1="95" y1="118" x2="105" y2="118" stroke="#8a7a6a" stroke-width="1"/>
  <line x1="95" y1="128" x2="105" y2="128" stroke="#8a7a6a" stroke-width="1"/>
  <line x1="95" y1="138" x2="105" y2="138" stroke="#8a7a6a" stroke-width="1"/>
  <!-- 蝴蝶刀翼 -->
  <path d="M85,90 Q70,110 75,145 L80,145 Q82,115 93,100" fill="url(#blade)" stroke="#9080b0" stroke-width="0.8" opacity="0.8"/>
  <path d="M115,90 Q130,110 125,145 L120,145 Q118,115 107,100" fill="url(#blade)" stroke="#9080b0" stroke-width="0.8" opacity="0.8"/>
  <!-- 星芒 -->
  <circle cx="100" cy="55" r="3" fill="#ffffff" opacity="0.8"/>
  <line x1="100" y1="45" x2="100" y2="35" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="110" y1="50" x2="118" y2="42" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="90" y1="50" x2="82" y2="42" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <!-- 底部装饰 -->
  <circle cx="100" cy="155" r="5" fill="#a080d0" opacity="0.6"/>
</svg>
